---
- name: git the python code
  hosts: obscon1
  tasks:
    - name: Ensure .ssh directory exists on remote host
      ansible.builtin.file:
        path: ~/.ssh
        state: directory
        mode: '0700'

    - name: Copy GitHub deploy key to remote host
      become: yes
      become_user: ansible
      ansible.builtin.copy:
        content: "{{ git_key_test | b64decode }}\n"
        dest: ~/.ssh/github_deploy_key
        mode: '0600'

    - name: Clone repository on remote host
      become: yes
      become_user: ansible
      ansible.builtin.git:
        repo: git@github.com:amillssma/ansible_test.git
        dest: /home/ansible/ansible_test
        key_file: ~/.ssh/github_deploy_key
        accept_hostkey: yes
